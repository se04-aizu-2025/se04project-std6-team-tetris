<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sort Test Engine</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 40px 20px;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
    }

    .header {
      background: rgba(255, 255, 255, 0.95);
      border-radius: 20px;
      padding: 40px;
      margin-bottom: 30px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
    }

    h1 {
      font-size: 48px;
      font-weight: 800;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 10px;
      letter-spacing: -1px;
    }

    .subtitle {
      font-size: 18px;
      color: #64748b;
    }

    .controls {
      background: rgba(255, 255, 255, 0.95);
      border-radius: 20px;
      padding: 30px;
      margin-bottom: 30px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
    }

    h2 {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 20px;
    }

    .method-selector {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 20px;
    }

    .method-label {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 20px;
      border-radius: 12px;
      background: #f1f5f9;
      color: #334155;
      cursor: pointer;
      transition: all 0.2s;
      font-weight: 600;
      font-size: 14px;
      user-select: none;
    }

    .method-label.selected {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }

    .run-button {
      padding: 16px 32px;
      font-size: 16px;
      font-weight: 700;
      color: white;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border: none;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
      transition: all 0.2s;
    }

    .run-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(102, 126, 234, 0.5);
    }

    .run-button:disabled {
      background: #94a3b8;
      cursor: not-allowed;
      transform: none;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }

    .stat-card {
      background: rgba(255, 255, 255, 0.95);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
    }

    .stat-card h3 {
      font-size: 20px;
      font-weight: 700;
      color: #1e293b;
      margin-bottom: 16px;
    }

    .stat-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .stat-label {
      color: #64748b;
      font-size: 14px;
    }

    .stat-value {
      font-weight: 600;
    }

    .pass-rate {
      font-size: 24px;
      font-weight: 800;
    }

    .pass-rate.perfect {
      color: #10b981;
    }

    .pass-rate.failed {
      color: #ef4444;
    }

    .results-section {
      background: rgba(255, 255, 255, 0.95);
      border-radius: 20px;
      padding: 30px;
      margin-bottom: 30px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
    }

    .test-result {
      display: grid;
      grid-template-columns: 200px 100px 100px 120px 1fr;
      gap: 16px;
      padding: 16px;
      border-radius: 12px;
      margin-bottom: 12px;
      align-items: center;
    }

    .test-result.pass {
      background: rgba(16, 185, 129, 0.1);
      border: 2px solid #10b981;
    }

    .test-result.fail {
      background: rgba(239, 68, 68, 0.1);
      border: 2px solid #ef4444;
    }

    .test-name {
      font-weight: 600;
    }

    .test-count {
      font-size: 12px;
      color: #64748b;
      margin-top: 4px;
    }

    .test-status {
      text-align: center;
    }

    .status-icon {
      font-size: 24px;
      font-weight: 800;
    }

    .status-label {
      font-size: 12px;
      color: #64748b;
      margin-top: 4px;
    }

    .error-text {
      font-size: 12px;
      color: #ef4444;
      font-family: monospace;
    }

    .current-test {
      display: inline-block;
      margin-left: 10px;
      font-weight: 600;
      color: #667eea;
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Header -->
    <div class="header">
      <h1>🧪 Sort Test Engine</h1>
      <p class="subtitle">Comprehensive testing suite for sorting algorithms</p>
    </div>

    <!-- Controls -->
    <div class="controls">
      <h2>Select Algorithms to Test</h2>
      
      <div class="method-selector" id="methodSelector"></div>

      <button class="run-button" id="runButton" onclick="runAllTests()">
        ▶️ Run All Tests
      </button>
      <span class="current-test" id="currentTest"></span>
    </div>

    <!-- Stats Grid -->
    <div class="stats-grid" id="statsGrid"></div>

    <!-- Results -->
    <div id="resultsContainer"></div>
  </div>

  <script>
    const SORT_METHODS = [
      { id: 'bubble', name: 'Bubble Sort' },
      { id: 'quick', name: 'Quick Sort' },
      { id: 'merge', name: 'Merge Sort' },
      { id: 'heap', name: 'Heap Sort' },
      { id: 'insertion', name: 'Insertion Sort' },
      { id: 'gnome', name: 'Gnome Sort' }
    ];

    const TEST_CASES = [
      {
        id: 'empty',
        name: 'Empty Array',
        input: [],
        expected: []
      },
      {
        id: 'single',
        name: 'Single Element',
        input: [42],
        expected: [42]
      },
      {
        id: 'sorted',
        name: 'Already Sorted',
        input: [1, 2, 3, 4, 5],
        expected: [1, 2, 3, 4, 5]
      },
      {
        id: 'reverse',
        name: 'Reverse Sorted',
        input: [5, 4, 3, 2, 1],
        expected: [1, 2, 3, 4, 5]
      },
      {
        id: 'duplicates',
        name: 'With Duplicates',
        input: [3, 1, 4, 1, 5, 9, 2, 6, 5],
        expected: [1, 1, 2, 3, 4, 5, 5, 6, 9]
      },
      {
        id: 'random-small',
        name: 'Random (10 elements)',
        input: Array.from({ length: 10 }, () => Math.floor(Math.random() * 100)),
        expected: null
      },
      {
        id: 'random-medium',
        name: 'Random (50 elements)',
        input: Array.from({ length: 50 }, () => Math.floor(Math.random() * 100)),
        expected: null
      },
      {
        id: 'random-large',
        name: 'Random (100 elements)',
        input: Array.from({ length: 100 }, () => Math.floor(Math.random() * 100)),
        expected: null
      },
      {
        id: 'all-same',
        name: 'All Same Value',
        input: Array(10).fill(7),
        expected: Array(10).fill(7)
      },
      {
        id: 'two-values',
        name: 'Only Two Values',
        input: [1, 2, 1, 2, 1, 2, 1, 2],
        expected: [1, 1, 1, 1, 2, 2, 2, 2]
      }
    ].map(tc => ({
      ...tc,
      expected: tc.expected || [...tc.input].sort((a, b) => a - b)
    }));

    let selectedMethods = SORT_METHODS.map(m => m.id);
    let results = {};
    let isRunning = false;

    // Initialize method selector
    function initMethodSelector() {
      const container = document.getElementById('methodSelector');
      SORT_METHODS.forEach(method => {
        const label = document.createElement('div');
        label.className = 'method-label selected';
        label.innerHTML = `
          <input type="checkbox" checked onchange="toggleMethod('${method.id}')">
          ${method.name}
        `;
        container.appendChild(label);
      });
    }

    // Toggle method selection
    function toggleMethod(methodId) {
      if (selectedMethods.includes(methodId)) {
        selectedMethods = selectedMethods.filter(id => id !== methodId);
      } else {
        selectedMethods.push(methodId);
      }
      updateMethodUI();
    }

    // Update method UI
    function updateMethodUI() {
      const labels = document.querySelectorAll('.method-label');
      labels.forEach((label, index) => {
        const method = SORT_METHODS[index];
        if (selectedMethods.includes(method.id)) {
          label.classList.add('selected');
          label.querySelector('input').checked = true;
        } else {
          label.classList.remove('selected');
          label.querySelector('input').checked = false;
        }
      });
    }

    // Check if array is sorted
    function isSorted(arr) {
      for (let i = 1; i < arr.length; i++) {
        if (arr[i] < arr[i - 1]) return false;
      }
      return true;
    }

    // Check if arrays are equal
    function arraysEqual(a, b) {
      if (a.length !== b.length) return false;
      for (let i = 0; i < a.length; i++) {
        if (a[i] !== b[i]) return false;
      }
      return true;
    }

    // Run single test
    async function runSingleTest(method, testCase) {
      const startTime = performance.now();
      
      try {
        const res = await fetch('http://127.0.0.1:8081/sort', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ 
            method: method, 
            array: testCase.input 
          })
        });

        if (!res.ok) {
          throw new Error(await res.text());
        }

        const data = await res.json();
        const endTime = performance.now();
        const executionTime = endTime - startTime;

        let resultArray = [];
        if (data.steps && data.steps.length > 0) {
          for (let i = data.steps.length - 1; i >= 0; i--) {
            if (data.steps[i].type === 'swap' && data.steps[i].array) {
              resultArray = data.steps[i].array;
              break;
            }
          }
        }
        
        if (resultArray.length === 0) {
          resultArray = data.initialArray || testCase.input;
        }

        const passed = arraysEqual(resultArray, testCase.expected);
        const sorted = isSorted(resultArray);
        const stepCount = data.steps ? data.steps.length : 0;

        return {
          passed,
          sorted,
          executionTime: Math.round(executionTime),
          stepCount,
          resultArray,
          error: null
        };
      } catch (error) {
        const endTime = performance.now();
        return {
          passed: false,
          sorted: false,
          executionTime: Math.round(endTime - startTime),
          stepCount: 0,
          resultArray: [],
          error: error.message
        };
      }
    }

    // Run all tests
    async function runAllTests() {
      if (isRunning || selectedMethods.length === 0) return;

      isRunning = true;
      results = {};
      document.getElementById('runButton').disabled = true;
      document.getElementById('runButton').textContent = '🔄 Running...';
      document.getElementById('statsGrid').innerHTML = '';
      document.getElementById('resultsContainer').innerHTML = '';

      for (const method of selectedMethods) {
        results[method] = {};
        
        for (const testCase of TEST_CASES) {
          document.getElementById('currentTest').textContent = `${method} - ${testCase.name}`;
          
          const result = await runSingleTest(method, testCase);
          results[method][testCase.id] = result;
          
          updateUI();
          await new Promise(resolve => setTimeout(resolve, 100));
        }
      }

      document.getElementById('currentTest').textContent = '';
      document.getElementById('runButton').disabled = false;
      document.getElementById('runButton').textContent = '▶️ Run All Tests';
      isRunning = false;
    }

    // Get statistics
    function getStats(methodId) {
      const methodResults = results[methodId];
      if (!methodResults) return null;

      const total = Object.keys(methodResults).length;
      const passed = Object.values(methodResults).filter(r => r.passed).length;
      const avgTime = Object.values(methodResults).reduce((sum, r) => sum + r.executionTime, 0) / total;
      const totalSteps = Object.values(methodResults).reduce((sum, r) => sum + r.stepCount, 0);

      return {
        total,
        passed,
        failed: total - passed,
        passRate: ((passed / total) * 100).toFixed(1),
        avgTime: Math.round(avgTime),
        totalSteps
      };
    }

    // Update UI
    function updateUI() {
      updateStatsGrid();
      updateResults();
    }

    // Update stats grid
    function updateStatsGrid() {
      const container = document.getElementById('statsGrid');
      container.innerHTML = '';

      selectedMethods.forEach(methodId => {
        const stats = getStats(methodId);
        if (!stats) return;

        const method = SORT_METHODS.find(m => m.id === methodId);
        const card = document.createElement('div');
        card.className = 'stat-card';
        card.innerHTML = `
          <h3>${method.name}</h3>
          <div class="stat-row">
            <span class="stat-label">Pass Rate</span>
            <span class="pass-rate ${stats.passRate === '100.0' ? 'perfect' : 'failed'}">
              ${stats.passRate}%
            </span>
          </div>
          <div class="stat-row">
            <span class="stat-label">Passed</span>
            <span class="stat-value" style="color: #10b981">✓ ${stats.passed}</span>
          </div>
          <div class="stat-row">
            <span class="stat-label">Failed</span>
            <span class="stat-value" style="color: #ef4444">✗ ${stats.failed}</span>
          </div>
          <div class="stat-row">
            <span class="stat-label">Avg Time</span>
            <span class="stat-value" style="color: #3b82f6">${stats.avgTime}ms</span>
          </div>
          <div class="stat-row">
            <span class="stat-label">Total Steps</span>
            <span class="stat-value">${stats.totalSteps.toLocaleString()}</span>
          </div>
        `;
        container.appendChild(card);
      });
    }

    // Update results
    function updateResults() {
      const container = document.getElementById('resultsContainer');
      container.innerHTML = '';

      selectedMethods.forEach(methodId => {
        const methodResults = results[methodId];
        if (!methodResults) return;

        const method = SORT_METHODS.find(m => m.id === methodId);
        const section = document.createElement('div');
        section.className = 'results-section';
        
        let html = `<h2>${method.name} - Detailed Results</h2>`;
        
        TEST_CASES.forEach(testCase => {
          const result = methodResults[testCase.id];
          if (!result) return;

          html += `
            <div class="test-result ${result.passed ? 'pass' : 'fail'}">
              <div>
                <div class="test-name">${testCase.name}</div>
                <div class="test-count">${testCase.input.length} elements</div>
              </div>
              <div class="test-status">
                <div class="status-icon">${result.passed ? '✓' : '✗'}</div>
                <div class="status-label">${result.passed ? 'PASS' : 'FAIL'}</div>
              </div>
              <div class="test-status">
                <div class="stat-value">${result.executionTime}ms</div>
                <div class="status-label">Time</div>
              </div>
              <div class="test-status">
                <div class="stat-value">${result.stepCount}</div>
                <div class="status-label">Steps</div>
              </div>
              ${result.error ? `<div class="error-text">Error: ${result.error}</div>` : '<div></div>'}
            </div>
          `;
        });

        section.innerHTML = html;
        container.appendChild(section);
      });
    }

    // Initialize on load
    initMethodSelector();
  </script>
</body>
</html>
